
services:
  ai-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HF_HOME: /app/model_cache
    volumes:
      - birdlab_data:/app/data
      - birdlab_models:/app/model_cache
    expose:
      - "8000"

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-worker:
    build:
      context: .
      dockerfile: backend/worker.Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  central-server:
    build:
      context: .
      dockerfile: central-server/BirdLab.CentralServer/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      AI_SERVER_URL: http://ai-server:8000
      AUTH_DB_PATH: /app/auth-data/auth.db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      # Ethereum Sepolia
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      BIRD_CONTRACT_ADDRESS: ${BIRD_CONTRACT_ADDRESS}
    volumes:
      - birdlab_auth:/app/auth-data
    depends_on:
      ai-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  birdlab_data:
  birdlab_models:
  birdlab_auth:
  rabbitmq_data:
